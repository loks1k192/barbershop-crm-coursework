<text x="357.0" y="486.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Запросы клиентов на запись (онлайн, по телефону, визит)</text>
<text x="357.0" y="551.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Сведения о филиалах, мастерах и услугах</text>
<text x="357.0" y="616.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Клиентская база из прежних систем (CSV)</text>
<text x="357.0" y="681.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Оплата клиента</text>
<text x="808.0" y="134.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Регламенты сети: правила записи, отмены и оплаты</text>
<text x="938.0" y="194.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Программа лояльности</text>
<text x="1068.0" y="254.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Законодательство: 152-ФЗ, 54-ФЗ</text>
<text x="1198.0" y="314.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Прайс-листы и часы работы филиалов</text>
<text x="1623.2" y="456.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Подтверждения и напоминания о записи</text>
<text x="1623.2" y="506.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Оказанные услуги</text>
<text x="1623.2" y="556.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Чеки и платёжные документы</text>
<text x="1623.2" y="606.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Бонусные операции, уровень лояльности</text>
<text x="1623.2" y="656.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Аналитические отчёты и KPI</text>
<text x="1623.2" y="706.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Журнал аудита изменений</text>
<text x="818.0" y="814.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Администраторы филиалов</text>
<text x="938.0" y="869.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Барберы</text>
