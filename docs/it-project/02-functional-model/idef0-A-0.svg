<text x="1198.0" y="979.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">CRM-система Barber CRM (REST API, PostgreSQL)</text>
<text x="80.0" y="1005.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#111">Цель моделирования: определить функции CRM-системы сети барбершопов и</text>
