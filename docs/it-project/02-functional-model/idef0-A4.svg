<text x="162.5" y="311.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Запрос: мастер, услуги, желаемая</text>
<text x="162.5" y="326.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">дата</text>
<text x="536.0" y="566.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Телефон и имя клиента</text>
<text x="1117.6" y="1056.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Запрос на перенос или отмену</text>
<text x="263.0" y="626.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Карточки клиентов</text>
<text x="360.0" y="129.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">График смен</text>
<text x="520.0" y="174.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Прайсы мастеров (длительность)</text>
<text x="1457.0" y="358.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Цены на момент записи</text>
<text x="720.0" y="119.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Регламенты: шаг сетки, окно онлайн-записи, правила отмены</text>
<text x="880.0" y="326.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Выбранный свободный слот</text>
<text x="1114.6" y="576.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Карточка клиента</text>
<text x="2012.0" y="636.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Новые клиенты</text>
<text x="1647.0" y="920.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Запись (scheduled)</text>
<text x="1972.6" y="866.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Уведомление об отказе: время занято или</text>
<text x="1972.6" y="881.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">вне смены</text>
<text x="2128.5" y="1056.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Подтверждения и напоминания</text>
<text x="2128.5" y="1101.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Записи на обслуживание</text>
<text x="1132.5" y="1218.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Освободившееся время (отмена, перенос)</text>
<text x="252.4" y="1356.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">Администратор / клиент (самозапись)</text>
<text x="557.7" y="1356.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#111">CRM-система Barber CRM</text>
<text x="20.0" y="34.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">ИСПОЛЬЗУЕТСЯ: курсовой проект</text>
<text x="516.0" y="34.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">АВТОР: Команда проекта Barber CRM</text>
<text x="1091.0" y="34.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">ПРОЕКТ: CRM сети барбершопов</text>
<text x="1620.0" y="34.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">ДАТА: 03.11.2026</text>
<text x="1896.0" y="34.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">СТАТУС: РАБОЧАЯ ВЕРСИЯ</text>
<text x="20.0" y="1425.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#111" font-weight="bold">УЗЕЛ: A4</text>
<text x="1127.0" y="1426.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">НАЗВАНИЕ: Записывать клиентов на услуги</text>
<text x="2001.0" y="1425.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#111" font-weight="bold">НОМЕР: FM-3</text>
<text x="450.0" y="335.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Подобрать свободное время</text>
<text x="450.0" y="353.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">(crm.free_slots)</text>
<text x="592.0" y="412.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#111" font-weight="bold">A41</text>
<text x="910.0" y="585.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Идентифицировать или</text>
<text x="910.0" y="603.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">зарегистрировать клиента</text>
<text x="1052.0" y="662.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#111" font-weight="bold">A42</text>
<text x="1370.0" y="835.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Зарегистрировать запись</text>
<text x="1370.0" y="853.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">(crm.book_appointment)</text>
<text x="1512.0" y="912.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#111" font-weight="bold">A43</text>
<text x="1830.0" y="1085.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Сопровождать запись:</text>
<text x="1830.0" y="1103.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">подтвердить, перенести, отменить</text>
<text x="1972.0" y="1162.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#111" font-weight="bold">A44</text>
