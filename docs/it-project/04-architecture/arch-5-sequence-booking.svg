<text x="680.0" y="111.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">+ валидация</text>
<text x="960.0" y="94.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">core: store</text>
